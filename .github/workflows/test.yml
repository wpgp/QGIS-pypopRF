name: Test engine and packaged QGIS plugin

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-engine.lock
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check release metadata and tag identity
        run: python scripts/check_release.py
      - name: Verify clean isolated engine setup on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          from pathlib import Path
          import sys
          import tempfile
          # Actions writes shell: python scripts under RUNNER_TEMP, not the checkout.
          sys.path.insert(0, str(Path.cwd()))
          from services.runtime_manager import RuntimeManager
          before = dict(os.environ)
          cache = Path(tempfile.mkdtemp(prefix="pypoprf-clean-")) / "engine"
          manager = RuntimeManager(Path.cwd(), cache)
          engine = manager.setup(sys.executable)
          assert manager.get_python() == engine
          assert engine.is_relative_to(cache)
          assert dict(os.environ) == before
      - run: python -m pytest -m "not qgis" -q
      - run: python -m ruff check core gui controllers services shared qgis_pypoprf.py __init__.py scripts tests
      - run: python scripts/build_plugin.py

  native-qgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - qgis/qgis:3.44-noble@sha256:497c1629c68ced7735dc25c25e33ada0040f5144099e92b78fae978bdf233466
          - qgis/qgis:4.2-trixie@sha256:56c69c92e316aa679e5c30ebf7fcfd89fd1124ec728106ec0cced1c71a28d877
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test a built ZIP with genuine QGIS, Qt and a separate engine
        env:
          QGIS_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --memory 4g --cpus 2 \
            -e QT_QPA_PLATFORM=offscreen \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            -w /workspace "$QGIS_IMAGE" \
            bash -ec '
              python3 -m venv --system-site-packages /tmp/ui-tests
              /tmp/ui-tests/bin/python -m pip install --ignore-installed pytest==9.1.1 uv==0.13.0
              export UV_PYTHON_INSTALL_DIR=/tmp/engine-python
              /tmp/ui-tests/bin/uv python install 3.12
              PYPOPRF_BASE_PYTHON=$(/tmp/ui-tests/bin/uv python find 3.12)
              export PYPOPRF_BASE_PYTHON
              PYPOPRF_TEST_ENGINE=$(python3 -c "import os; from services.runtime_manager import RuntimeManager; print(RuntimeManager(\"/workspace\", \"/tmp/engine-cache\").setup(os.environ[\"PYPOPRF_BASE_PYTHON\"]))")
              export PYPOPRF_TEST_ENGINE
              python3 scripts/build_plugin.py --output /tmp/plugin.zip
              python3 -m zipfile -e /tmp/plugin.zip /tmp/plugin-package
              export PYPOPRF_TEST_PLUGIN_ROOT=/tmp/plugin-package/pypopRF
              export PYPOPRF_TEST_PLUGIN_ZIP=/tmp/plugin.zip
              /tmp/ui-tests/bin/python -m pytest tests/native -q -p no:cacheprovider
            '
